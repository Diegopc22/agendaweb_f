<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AgendaWeb · Tus eventos y citas</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&family=Raleway:wght@400;500;600;700&display=swap" rel="stylesheet">
>
  <script>
    (function () {
      var t = null;
      try { t = localStorage.getItem("agendaweb:tema"); } catch (e) {}
      if (!t) t = window.matchMedia && matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light";
      document.documentElement.setAttribute("data-theme", t);
    })();
  </script>

  <style>
    :root {
      --color-fondo: #F5F8F7;
      --color-superficie: #FFFFFF;
      --color-texto: #1F2D3A;
      --color-texto-secundario: #52646F;
      --color-acento: #2C6E8A;
      --color-acento-hover: #245B73;
      --color-acento-suave: #E3EFF3;
      --color-borde: #D5E1DE;
      --color-texto-sobre-acento: #FFFFFF;

      --fuente-titulos: "Merriweather", Georgia, "Times New Roman", serif;
      --fuente-cuerpo: "Raleway", "Helvetica Neue", Arial, sans-serif;
      --radio: 12px;
      --sombra-suave: 0 2px 8px rgba(31, 45, 58, 0.06);
      color-scheme: light;
    }

    :root[data-theme="dark"] {
      --color-fondo: #121A20;
      --color-superficie: #1B252D;
      --color-texto: #E8EEF1;
      --color-texto-secundario: #A6B5BE;
      --color-acento: #6FB7D3;
      --color-acento-hover: #8CC8DE;
      --color-acento-suave: #22343F;
      --color-borde: #2E3C46;
      --color-texto-sobre-acento: #0F1C24;
      --sombra-suave: 0 2px 10px rgba(0, 0, 0, 0.35);
      color-scheme: dark;
    }

    *, *::before, *::after { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--color-fondo);
      color: var(--color-texto);
      font-family: var(--fuente-cuerpo);
      font-size: 1rem;
      line-height: 1.6;
      transition: background 0.2s ease, color 0.2s ease;
    }
    h1, h2, h3 { font-family: var(--fuente-titulos); line-height: 1.3; margin: 0; }
    :focus-visible { outline: 3px solid var(--color-acento); outline-offset: 2px; }

    .cabecera { background: var(--color-superficie); border-bottom: 1px solid var(--color-borde); }
    .cabecera__interior {
      max-width: 1080px; margin: 0 auto; padding: 0.9rem 1.25rem;
      display: flex; align-items: center; justify-content: space-between; gap: 1rem;
    }
    .marca { font-family: var(--fuente-titulos); font-weight: 700; font-size: 1.25rem; color: var(--color-texto); text-decoration: none; }
    .marca span { color: var(--color-acento); }

    .btn-tema {
      width: 44px; height: 44px; display: grid; place-items: center;
      background: var(--color-fondo); color: var(--color-texto);
      border: 1px solid var(--color-borde); border-radius: 50%; cursor: pointer;
    }
    .btn-tema:hover { border-color: var(--color-acento); color: var(--color-acento); }
    .btn-tema svg { width: 22px; height: 22px; }
    .icono-sol { display: none; }
    :root[data-theme="dark"] .icono-sol { display: block; }
    :root[data-theme="dark"] .icono-luna { display: none; }

    .contenedor { max-width: 1080px; margin: 0 auto; padding: 2rem 1.25rem 3rem; }
    .introduccion { margin-bottom: 2rem; max-width: 60ch; }
    .introduccion h1 { font-size: clamp(1.6rem, 4vw, 2.2rem); margin-bottom: 0.5rem; }
    .introduccion p { margin: 0; color: var(--color-texto-secundario); }

    .rejilla { display: grid; grid-template-columns: 1fr; gap: 1.5rem; }
    @media (min-width: 900px) { .rejilla { grid-template-columns: 380px 1fr; align-items: start; } }
    .columna { display: grid; gap: 1.5rem; }

    .tarjeta {
      background: var(--color-superficie); border: 1px solid var(--color-borde);
      border-radius: var(--radio); box-shadow: var(--sombra-suave); padding: 1.5rem;
    }
    .tarjeta > h2 { font-size: 1.15rem; margin-bottom: 1.1rem; }

    .campo { margin-bottom: 1.1rem; }
    .campo label { display: block; font-weight: 600; font-size: 0.95rem; margin-bottom: 0.4rem; }
    .campo input, .campo textarea {
      width: 100%; min-height: 3.25rem;
      font: inherit; font-size: 1.05rem; color: var(--color-texto);
      background: var(--color-fondo); border: 1.5px solid var(--color-borde);
      border-radius: var(--radio); padding: 0.75rem 1rem;
    }
    .campo input[type="date"], .campo input[type="time"] { font-weight: 600; cursor: pointer; }
    .campo input:focus, .campo textarea:focus {
      outline: none; border-color: var(--color-acento);
      box-shadow: 0 0 0 3px color-mix(in srgb, var(--color-acento) 30%, transparent);
    }
    .campo textarea { resize: vertical; min-height: 96px; }

    .boton {
      display: inline-block; background: var(--color-acento); color: var(--color-texto-sobre-acento);
      border: none; border-radius: var(--radio); font-family: var(--fuente-cuerpo);
      font-weight: 700; font-size: 1.05rem; padding: 0.85rem 1.25rem; cursor: pointer;
      transition: background 0.15s ease;
    }
    .boton:hover { background: var(--color-acento-hover); }
    .boton--bloque { width: 100%; }
    .boton--suave {
      background: transparent; color: var(--color-acento); border: 1px solid var(--color-borde);
      padding: 0.4rem 0.9rem; font-size: 0.875rem; font-weight: 600;
    }
    .boton--suave:hover { background: var(--color-acento-suave); }

    .cal__cabecera { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; gap: 0.5rem; }
    .cal__mes { font-family: var(--fuente-titulos); font-size: 1.2rem; font-weight: 700; text-transform: capitalize; margin: 0; }
    .cal__nav { display: flex; gap: 0.4rem; }
    .cal__nav button {
      width: 40px; height: 40px; border-radius: 50%; cursor: pointer;
      background: var(--color-fondo); color: var(--color-texto);
      border: 1px solid var(--color-borde); font-size: 1.1rem; line-height: 1;
    }
    .cal__nav button:hover { border-color: var(--color-acento); color: var(--color-acento); }
    .cal__nav .cal__hoy { width: auto; padding: 0 0.9rem; border-radius: 20px; font: 600 0.875rem var(--fuente-cuerpo); }

    .cal__grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
    .cal__dia-sem { text-align: center; font-size: 0.85rem; font-weight: 600; color: var(--color-texto-secundario); padding: 0.3rem 0; }
    .cal__celda {
      position: relative; aspect-ratio: 1 / 1; min-height: 44px;
      display: flex; align-items: center; justify-content: center;
      background: transparent; color: var(--color-texto);
      border: 1.5px solid transparent; border-radius: 12px;
      font: 600 1rem var(--fuente-cuerpo); cursor: pointer;
    }
    .cal__celda:hover { background: var(--color-acento-suave); }
    .cal__celda--hoy { border-color: var(--color-acento); }
    .cal__celda[aria-pressed="true"] { background: var(--color-acento); color: var(--color-texto-sobre-acento); }
    .cal__celda--evento::after {
      content: ""; position: absolute; bottom: 6px; left: 50%; transform: translateX(-50%);
      width: 6px; height: 6px; border-radius: 50%; background: var(--color-acento);
    }
    .cal__celda[aria-pressed="true"].cal__celda--evento::after { background: var(--color-texto-sobre-acento); }
    .cal__vacio { visibility: hidden; }

    .lista__cabecera { display: flex; align-items: center; justify-content: space-between; gap: 1rem; margin-bottom: 1rem; }
    .lista__cabecera h2 { font-size: 1.15rem; }
    .dia { margin-bottom: 1.25rem; }
    .dia h3 { font-size: 1rem; margin-bottom: 0.6rem; text-transform: capitalize; }
    .evento {
      display: flex; gap: 1rem; align-items: flex-start;
      background: var(--color-fondo); border: 1px solid var(--color-borde);
      border-left: 4px solid var(--color-acento); border-radius: var(--radio);
      padding: 0.9rem 1rem; margin-bottom: 0.6rem;
    }
    .evento__hora { min-width: 3.6rem; font-weight: 700; font-size: 1.05rem; color: var(--color-acento); }
    .evento__cuerpo { flex: 1; min-width: 0; }
    .evento__titulo { font-weight: 700; margin: 0; overflow-wrap: anywhere; }
    .evento__notas { margin: 0.2rem 0 0; color: var(--color-texto-secundario); font-size: 0.925rem; overflow-wrap: anywhere; }
    .vacio { text-align: center; padding: 1.5rem 1rem; color: var(--color-texto-secundario); }
    .vacio strong { display: block; color: var(--color-texto); font-family: var(--fuente-titulos); margin-bottom: 0.25rem; }

    .pie { border-top: 1px solid var(--color-borde); text-align: center; padding: 1.5rem 1rem; color: var(--color-texto-secundario); font-size: 0.9rem; }
    @media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
  </style>
</head>
<body>

  <header class="cabecera">
    <div class="cabecera__interior">
      <a class="marca" href="#">Agenda<span>Web</span></a>
      <button class="btn-tema" id="btnTema" type="button" aria-label="Cambiar a modo oscuro" title="Cambiar tema">
        <svg class="icono-luna" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
        <svg class="icono-sol" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      </button>
    </div>
  </header>

  <main class="contenedor">
    <section class="introduccion">
      <h1>Tu agenda, sin ruido</h1>
      <p>Elige un día en el calendario, registra tu evento y míralo ordenado por fecha.</p>
    </section>

    <div class="rejilla">

      <section class="tarjeta" aria-labelledby="titulo-form">
        <h2 id="titulo-form">Nuevo evento</h2>
        <form id="formulario">
          <div class="campo">
            <label for="titulo">Título</label>
            <input id="titulo" name="titulo" type="text" placeholder="Ej. Cita con el dentista" required>
          </div>
          <div class="campo">
            <label for="fecha">Fecha</label>
            <input id="fecha" name="fecha" type="date" required>
          </div>
          <div class="campo">
            <label for="hora">Hora</label>
            <input id="hora" name="hora" type="time" required>
          </div>
          <div class="campo">
            <label for="notas">Notas (opcional)</label>
            <textarea id="notas" name="notas" placeholder="Lugar, recordatorios…"></textarea>
          </div>
          <button class="boton boton--bloque" type="submit">Guardar evento</button>
        </form>
      </section>

      <div class="columna">
        <section class="tarjeta" aria-label="Calendario">
          <div class="cal__cabecera">
            <h2 class="cal__mes" id="calMes" aria-live="polite"></h2>
            <div class="cal__nav">
              <button type="button" id="calPrev" aria-label="Mes anterior">‹</button>
              <button type="button" id="calHoy" class="cal__hoy">Hoy</button>
              <button type="button" id="calNext" aria-label="Mes siguiente">›</button>
            </div>
          </div>
          <div class="cal__grid" id="calGrid"></div>
        </section>

        <section class="tarjeta" aria-labelledby="titulo-lista">
          <div class="lista__cabecera">
            <h2 id="titulo-lista">Próximos eventos</h2>
            <button type="button" class="boton boton--suave" id="verTodos" hidden>Ver todos</button>
          </div>
          <div id="lista" aria-live="polite"></div>
        </section>
      </div>

    </div>
  </main>

  <footer class="pie">AgendaWeb · Tus datos se guardan solo en este navegador.</footer>

  <script>
    const CLAVE = "agendaweb:eventos";
    const $ = id => document.getElementById(id);
    const pad = n => String(n).padStart(2, "0");
    const aTexto = (y, m, d) => `${y}-${pad(m + 1)}-${pad(d)}`;

    const hoy = new Date();
    const hoyTxt = aTexto(hoy.getFullYear(), hoy.getMonth(), hoy.getDate());
    let vista = { y: hoy.getFullYear(), m: hoy.getMonth() };
    let seleccionado = null;
    let eventos = [];

    function cargar() { try { eventos = JSON.parse(localStorage.getItem(CLAVE)) || []; } catch (e) { eventos = []; } }
    function guardar() { try { localStorage.setItem(CLAVE, JSON.stringify(eventos)); } catch (e) {} }

    function el(tag, clase, texto) {
      const n = document.createElement(tag);
      if (clase) n.className = clase;
      if (texto) n.textContent = texto;
      return n;
    }
    const nombreDia = f => new Date(f + "T00:00:00").toLocaleDateString("es-MX", { weekday: "long", day: "numeric", month: "long", year: "numeric" });

    function actualizarBotonTema() {
      const oscuro = document.documentElement.dataset.theme === "dark";
      $("btnTema").setAttribute("aria-label", oscuro ? "Cambiar a modo claro" : "Cambiar a modo oscuro");
    }
    $("btnTema").addEventListener("click", () => {
      const nuevo = document.documentElement.dataset.theme === "dark" ? "light" : "dark";
      document.documentElement.dataset.theme = nuevo;
      try { localStorage.setItem("agendaweb:tema", nuevo); } catch (e) {}
      actualizarBotonTema();
    });

    function pintarCalendario() {
      const grid = $("calGrid");
      grid.replaceChildren();
      $("calMes").textContent = new Date(vista.y, vista.m, 1).toLocaleDateString("es-MX", { month: "long", year: "numeric" });

      ["Lun", "Mar", "Mié", "Jue", "Vie", "Sáb", "Dom"].forEach(d => grid.append(el("div", "cal__dia-sem", d)));

      const primero = (new Date(vista.y, vista.m, 1).getDay() + 6) % 7; 
      const total = new Date(vista.y, vista.m + 1, 0).getDate();
      const conEvento = new Set(eventos.map(e => e.fecha));

      for (let i = 0; i < primero; i++) grid.append(el("div", "cal__vacio"));

      for (let d = 1; d <= total; d++) {
        const f = aTexto(vista.y, vista.m, d);
        let clase = "cal__celda";
        if (f === hoyTxt) clase += " cal__celda--hoy";
        if (conEvento.has(f)) clase += " cal__celda--evento";
        const b = el("button", clase, String(d));
        b.type = "button";
        b.setAttribute("aria-pressed", f === seleccionado ? "true" : "false");
        b.setAttribute("aria-label", nombreDia(f) + (conEvento.has(f) ? ", con eventos" : ""));
        b.addEventListener("click", () => {
          seleccionado = (seleccionado === f) ? null : f;
          if (seleccionado) $("fecha").value = seleccionado;
          pintar();
        });
        grid.append(b);
      }
    }
    $("calPrev").addEventListener("click", () => { vista.m--; if (vista.m < 0) { vista.m = 11; vista.y--; } pintarCalendario(); });
    $("calNext").addEventListener("click", () => { vista.m++; if (vista.m > 11) { vista.m = 0; vista.y++; } pintarCalendario(); });
    $("calHoy").addEventListener("click", () => {
      vista = { y: hoy.getFullYear(), m: hoy.getMonth() };
      seleccionado = hoyTxt; $("fecha").value = hoyTxt; pintar();
    });
    $("verTodos").addEventListener("click", () => { seleccionado = null; pintar(); });

    function pintarLista() {
      const lista = $("lista");
      lista.replaceChildren();
      $("titulo-lista").textContent = seleccionado ? "Eventos del día" : "Próximos eventos";
      $("verTodos").hidden = !seleccionado;

      let visibles = seleccionado ? eventos.filter(e => e.fecha === seleccionado) : eventos.filter(e => e.fecha >= hoyTxt);
      visibles = [...visibles].sort((a, b) => (a.fecha + a.hora).localeCompare(b.fecha + b.hora));

      if (visibles.length === 0) {
        const v = el("div", "vacio");
        v.append(el("strong", "", seleccionado ? "Sin eventos este día" : "Aún no tienes eventos próximos"),seleccionado ? "Agrega uno con el formulario." : "Agrega el primero con el formulario.");
        lista.append(v);
        return;
      }

      const porDia = {};
      visibles.forEach(ev => (porDia[ev.fecha] ||= []).push(ev));

      Object.keys(porDia).forEach(f => {
        const dia = el("div", "dia");
        dia.append(el("h3", "", nombreDia(f)));
        porDia[f].forEach(ev => {
          const item = el("article", "evento");
          item.append(el("div", "evento__hora", ev.hora));
          const cuerpo = el("div", "evento__cuerpo");
          cuerpo.append(el("p", "evento__titulo", ev.titulo));
          if (ev.notas) cuerpo.append(el("p", "evento__notas", ev.notas));
          item.append(cuerpo);
          const borrar = el("button", "boton boton--suave", "Eliminar");
          borrar.type = "button";
          borrar.setAttribute("aria-label", "Eliminar evento " + ev.titulo);
          borrar.addEventListener("click", () => { eventos = eventos.filter(x => x.id !== ev.id); guardar(); pintar(); });
          item.append(borrar);
          dia.append(item);
        });
        lista.append(dia);
      });
    }

    function pintar() { pintarCalendario(); pintarLista(); }

    $("formulario").addEventListener("submit", e => {
      e.preventDefault();
      const d = new FormData(e.target);
      const fecha = d.get("fecha");
      eventos.push({
        id: Date.now().toString(36) + Math.random().toString(36).slice(2, 6),
        titulo: d.get("titulo").trim(), fecha, hora: d.get("hora"), notas: d.get("notas").trim()
      });
      guardar();
      const [y, m] = fecha.split("-").map(Number);
      vista = { y, m: m - 1 };
      seleccionado = fecha;
      e.target.reset();
      $("fecha").value = fecha;
      pintar();
      $("titulo").focus();
    });

    cargar();
    $("fecha").value = hoyTxt;
    actualizarBotonTema();
    pintar();
  </script>
</body>
</html>
